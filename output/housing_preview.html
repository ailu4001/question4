<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壳体 3D 预览（调试版）</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  #log{position:fixed;left:8px;top:8px;color:#ff8;font:12px/1.6 Consolas,monospace;
       white-space:pre-wrap;z-index:9;max-width:85%;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:6px}
  canvas{display:block}
</style>
</head>
<body>
<div id="log">页面加载中...</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
  var logEl = document.getElementById('log');
  function log(m){ logEl.textContent += m + '\n'; console.log(m); }
  window.addEventListener('error', function(ev){ log('JS错误: ' + ev.message); });

  var tc = document.createElement('canvas');
  var glc = tc.getContext('webgl') || tc.getContext('experimental-webgl');
  log('WebGL: ' + (glc ? '可用' : '不可用'));

  var renderer;
  try { renderer = new THREE.WebGLRenderer({antialias:true}); log('Renderer: OK'); }
  catch(e){ log('Renderer创建失败: ' + e.message); }

  if (renderer) {
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x22242a);
    var camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.001, 100);
    camera.position.set(0.3, 0.25, 0.35);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    var key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(1, 2, 1.5); scene.add(key);
    var rim = new THREE.DirectionalLight(0x8899ff, 0.8); rim.position.set(-2, 1, -1); scene.add(rim);

    var ctrl = new THREE.OrbitControls(camera, renderer.domElement);
    ctrl.enableDamping = true; ctrl.autoRotate = true; ctrl.autoRotateSpeed = 3;

    var loader = new THREE.GLTFLoader();
    loader.load('housing.glb', function(g){
      log('模型加载: 成功');
      var model = g.scene || g;
      scene.add(model);
      var box = new THREE.Box3().setFromObject(model);
      var sphere = box.getBoundingSphere(new THREE.Sphere());
      var center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      log('包围球半径: ' + sphere.radius.toFixed(5) + ' m');
      var d = Math.max(sphere.radius * 3.2, 0.05);
      camera.position.set(d*0.9, d*0.6, d*1.1);
      ctrl.target.set(0,0,0); ctrl.update();
      log('相机距离: ' + d.toFixed(5) + ' m');
    }, undefined, function(err){
      log('模型加载失败: ' + (err && (err.message || err)));
    });

    function loop(){ requestAnimationFrame(loop); ctrl.update(); renderer.render(scene, camera); }
    loop();
    addEventListener('resize', function(){
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  }
</script>
</body>
</html>
