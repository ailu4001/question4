<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人物浮雕 · 2.5D 交互预览（离线）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#16181c}
  canvas{display:block}
  #tip{position:fixed;left:12px;bottom:10px;color:#9aa;font:13px/1.6 system-ui;pointer-events:none;
       background:rgba(0,0,0,.5);padding:6px 10px;border-radius:8px;z-index:9}
  #err{position:fixed;left:12px;top:10px;color:#f88;font:13px/1.5 system-ui;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<div id="tip">🖱 左键拖拽旋转 · 滚轮缩放 · 右键平移</div>
<div id="err"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1e24);
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.001, 100);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.2, 2.4, 1.6); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.6); rim.position.set(-2, 1, -1); scene.add(rim);

  const ctrl = new THREE.OrbitControls(camera, renderer.domElement);
  ctrl.enableDamping = true; ctrl.dampingFactor = 0.08;

  new THREE.GLTFLoader().load('person.glb', function (g) {
    const model = g.scene || g;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    model.position.sub(center);
    const d = sphere.radius * 2.8;
    camera.position.set(d*0.9, d*0.55, d*1.15);
    ctrl.target.set(0, 0, 0); ctrl.update();
  }, undefined, function (err) {
    document.getElementById('err').textContent = '模型加载失败: ' + (err && err.message ? err.message : err);
  });

  function loop(){ requestAnimationFrame(loop); ctrl.update(); renderer.render(scene, camera); }
  loop();
  addEventListener('resize', function(){
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
